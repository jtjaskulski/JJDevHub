name: web

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/Clients/web/**"
      - "src/Clients/.dockerignore"
      - "src/Clients/shared/theme/**"
      - "infra/docker/docker-compose.yml"
      - "infra/ci/pnpm-audit.sh"
      - "infra/ci/pnpm-audit-gate.mjs"
      - "infra/ci/pnpm-audit-gate.test.mjs"
      - "infra/ci/trivy-web.sh"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Clients/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/Clients/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        working-directory: .
        run: ./infra/ci/pnpm-audit.sh

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Install Trivy
        working-directory: .
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  /tmp/${tarball}" | sha256sum -c -
          sudo tar -xzf "/tmp/${tarball}" -C /usr/local/bin trivy
          trivy --version

      - name: Docker image + Trivy
        working-directory: .
        run: ./infra/ci/trivy-web.sh

  sonar:
    name: sonar-web
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, jjdevhub]
    defaults:
      run:
        working-directory: src/Clients/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/Clients/web/pnpm-lock.yaml

      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test:ci

      - name: Sonar scan
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEB }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=jjdevhub-web \
            -Dsonar.sources=src/Clients/web/src \
            -Dsonar.exclusions='**/node_modules/**,**/*.spec.ts,**/jjdevhub-api.client.ts' \
            -Dsonar.qualitygate.wait=true
