name: web

on:
  pull_request:
    paths:
      - "src/Clients/web/**"
      - "src/Clients/shared/theme/**"
      - "infra/docker/docker-compose.yml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "src/Clients/web/**"
      - "src/Clients/shared/theme/**"
      - "infra/docker/docker-compose.yml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  build:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Clients/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Clients/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/Clients/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Docker image
        working-directory: .
        run: docker build -f src/Clients/web/Dockerfile src/Clients
