name: api

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - "tests/JJDevHub.Api.Tests/**"
      - "nuget.config"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "JJDevHub.sln"
      - "infra/docker/Dockerfile"
      - "infra/docker/docker-compose.yml"
      - "infra/jaeger/**"
      - "infra/grafana/**"
      - "infra/ci/nuget-audit.sh"
      - "infra/ci/observability-smoke.sh"
      - "infra/ci/trivy-api.sh"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Observability config
        run: ./infra/ci/observability-smoke.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore JJDevHub.sln

      - name: NuGet audit
        run: ./infra/ci/nuget-audit.sh

      - name: Build
        run: dotnet build JJDevHub.sln --no-restore -c Release

      - name: Test
        run: dotnet test tests/JJDevHub.Api.Tests/JJDevHub.Api.Tests.csproj --no-build -c Release

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  /tmp/${tarball}" | sha256sum -c -
          sudo tar -xzf "/tmp/${tarball}" -C /usr/local/bin trivy
          trivy --version

      - name: Docker image + Trivy
        run: ./infra/ci/trivy-api.sh

  sonar:
    name: sonar-api
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, jjdevhub]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: SonarScanner begin
        run: |
          if ! dotnet tool install --global dotnet-sonarscanner; then
            dotnet tool update --global dotnet-sonarscanner
          fi
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"jjdevhub-api" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN_API }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      - name: Build for Sonar
        run: dotnet build JJDevHub.sln -c Release

      - name: Test with coverage
        run: |
          dotnet test tests/JJDevHub.Api.Tests/JJDevHub.Api.Tests.csproj -c Release --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory TestResults

      - name: SonarScanner end
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN_API }}"
