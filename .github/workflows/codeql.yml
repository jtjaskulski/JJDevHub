name: codeql

on:
  pull_request:
    branches:
      - develop
      - release
      - main
  push:
    branches:
      - develop
      - release
      - main

permissions: {}

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Suchy przebieg
        run: bash tests/ci/codeql.sh

      - name: Detect languages
        id: languages
        run: |
          set -euo pipefail
          output=$(.github/scripts/codeql-languages.sh)
          printf '%s\n' "$output"
          if [[ $output == 'no material' ]]; then
            {
              echo "skip=true"
              echo "csharp=false"
              echo "languages="
              echo "build_mode=skip"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          languages=$(printf '%s\n' "$output" | grep -vx 'no material: .*' | paste -sd, -)
          echo "languages=${languages}" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$output" | grep -qx csharp; then
            echo "csharp=true" >> "$GITHUB_OUTPUT"
          else
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi
          count=$(printf '%s\n' "$output" | grep -vx 'no material: .*' | grep -c .)
          if [[ $count -eq 1 && $languages == csharp ]]; then
            echo "build_mode=manual" >> "$GITHUB_OUTPUT"
          elif [[ $count -eq 1 ]]; then
            echo "build_mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "build_mode=both" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.languages.outputs.build_mode == 'manual' || steps.languages.outputs.build_mode == 'none'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ steps.languages.outputs.languages }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
          build-mode: ${{ steps.languages.outputs.build_mode }}

      - name: Initialize CodeQL for both languages
        if: steps.languages.outputs.build_mode == 'both'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ steps.languages.outputs.languages }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Setup .NET
        if: steps.languages.outputs.csharp == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build C#
        if: steps.languages.outputs.csharp == 'true'
        run: |
          set -euo pipefail
          if [[ ! -f global.json ]]; then
            echo "brak global.json przy projekcie" >&2
            exit 1
          fi
          projects=()
          while IFS= read -r csproj; do
            [[ -z $csproj ]] && continue
            projects+=("$csproj")
          done < <(git ls-files '*.csproj')
          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "brak projektu C#" >&2
            exit 1
          fi
          for csproj in "${projects[@]}"; do
            dotnet build "$csproj" --configuration Release
          done

      - name: Analyze
        id: analyze
        if: steps.languages.outputs.skip != 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          upload-database: false
          output: codeql-results

      - name: Upload SARIF artifact
        if: steps.languages.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14
          if-no-files-found: warn

      - name: Gate
        if: steps.languages.outputs.skip != 'true'
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r sarif; do
            [[ -z $sarif ]] && continue
            found=1
            if ! .github/scripts/codeql-gate.sh --sarif "$sarif"; then
              status=1
            fi
          done < <(find codeql-results -name '*.sarif' -print)
          if [[ $found -eq 0 ]]; then
            echo "brak pliku SARIF" >&2
            exit 1
          fi
          exit "$status"

      - name: Upload SARIF
        if: steps.languages.outputs.skip != 'true' && steps.analyze.outcome == 'success' && (success() || failure())
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: codeql-results
