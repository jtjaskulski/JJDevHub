<header>
  <a routerLink="/" class="brand">{{ title }}</a>
  <nav>
    <a routerLink="/">Home</a>
    @if (isAuthenticated()) {
      <button type="button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register">Register</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
