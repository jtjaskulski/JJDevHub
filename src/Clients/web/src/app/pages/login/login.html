<section class="card">
  <h2>Log in</h2>
  <form (ngSubmit)="submit()">
    <label>
      Email
      <input name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
    </label>
    <label>
      Password
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="current-password"
      />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="pending()">{{ pending() ? 'Signing in…' : 'Log in' }}</button>
  </form>
  <p class="hint">No account? <a routerLink="/register">Register</a></p>
</section>
