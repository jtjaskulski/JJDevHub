<section class="card">
  <h2>Register</h2>
  <form (ngSubmit)="submit()">
    <label>
      Email
      <input name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
    </label>
    <label>
      Password
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="pending()">
      {{ pending() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>
  <p class="hint">Already registered? <a routerLink="/login">Log in</a></p>
</section>
